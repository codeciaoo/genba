name: 機能リクエスト
description: 新機能や改善の提案
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        機能リクエストありがとうございます！

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: どんな課題を解決したいですか？
      placeholder: |
        現在は〇〇ができないため、△△に困っている。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 提案する解決策
      description: どのような機能があれば課題が解決しますか？
      placeholder: |
        〇〇ができるボタンがあれば解決する。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 他に検討した解決策があれば

  - type: dropdown
    id: priority
    attributes:
      label: 優先度（あなたの感覚で）
      options:
        - 低（あると便利）
        - 中（業務効率が上がる）
        - 高（これがないと困る）
    validations:
      required: true

  - type: dropdown
    id: target
    attributes:
      label: 対象
      options:
        - モバイルアプリ
        - LP（ランディングページ）
        - Web管理画面
        - その他
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 補足情報
      description: スクリーンショットや参考リンクなど
