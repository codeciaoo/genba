<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 夕暮れグラデーション -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3d;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#2d3561;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#c77700;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#f5c518;stop-opacity:0.3" />
    </linearGradient>

    <!-- オーバーレイ用の暗いグラデーション -->
    <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3d;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1a1f3d;stop-opacity:0.4" />
    </linearGradient>
  </defs>

  <!-- 夕暮れ背景 -->
  <rect width="800" height="600" fill="url(#skyGradient)"/>

  <!-- 車内シルエット（ダッシュボード） -->
  <path d="M0 380 Q200 350 400 360 Q600 370 800 350 L800 600 L0 600 Z" fill="#0d0d0d" opacity="0.9"/>

  <!-- ダッシュボード上部の曲線 -->
  <path d="M0 400 Q200 380 400 390 Q600 400 800 380 L800 420 Q600 440 400 430 Q200 420 0 440 Z" fill="#1a1a1a" opacity="0.8"/>

  <!-- フロントガラスの反射 -->
  <path d="M100 200 L700 180 L750 350 L50 370 Z" fill="#147878" opacity="0.05"/>

  <!-- サイドミラー（左） -->
  <ellipse cx="80" cy="280" rx="30" ry="20" fill="#1a1a1a" opacity="0.7"/>

  <!-- ハンドル（シルエット） -->
  <circle cx="200" cy="450" r="60" fill="none" stroke="#2a2a2a" stroke-width="12" opacity="0.6"/>
  <circle cx="200" cy="450" r="30" fill="#2a2a2a" opacity="0.6"/>

  <!-- スマホを持つ手のシルエット -->
  <g transform="translate(480, 320)">
    <!-- スマホ本体 -->
    <rect x="0" y="0" width="60" height="100" rx="8" fill="#2a2a2a"/>
    <rect x="4" y="8" width="52" height="80" rx="2" fill="#147878" opacity="0.3"/>

    <!-- スマホ画面の光 -->
    <rect x="8" y="12" width="44" height="72" rx="2" fill="#e0f5f5" opacity="0.2"/>

    <!-- 手のシルエット -->
    <path d="M-10 100 Q-20 80 -15 60 Q-10 40 5 30 L5 100 Z" fill="#1a1a1a" opacity="0.8"/>
    <path d="M60 100 Q80 90 75 70 Q70 50 55 40 L55 100 Z" fill="#1a1a1a" opacity="0.8"/>
    <ellipse cx="30" cy="110" rx="35" ry="15" fill="#1a1a1a" opacity="0.8"/>
  </g>

  <!-- 音声波形アイコン（スマホから出る） -->
  <g transform="translate(510, 340)" opacity="0.4">
    <rect x="70" y="20" width="3" height="15" rx="1" fill="#e0f5f5"/>
    <rect x="78" y="15" width="3" height="25" rx="1" fill="#e0f5f5"/>
    <rect x="86" y="10" width="3" height="35" rx="1" fill="#e0f5f5"/>
    <rect x="94" y="15" width="3" height="25" rx="1" fill="#e0f5f5"/>
    <rect x="102" y="20" width="3" height="15" rx="1" fill="#e0f5f5"/>
  </g>

  <!-- 遠景の建物シルエット -->
  <rect x="50" y="300" width="40" height="80" fill="#1a1a1a" opacity="0.3"/>
  <rect x="100" y="280" width="30" height="100" fill="#1a1a1a" opacity="0.3"/>
  <rect x="650" y="290" width="50" height="90" fill="#1a1a1a" opacity="0.3"/>
  <rect x="720" y="310" width="35" height="70" fill="#1a1a1a" opacity="0.3"/>

  <!-- 窓の光（建物） -->
  <rect x="60" y="320" width="8" height="8" fill="#f5c518" opacity="0.5"/>
  <rect x="75" y="340" width="8" height="8" fill="#f5c518" opacity="0.4"/>
  <rect x="110" y="300" width="8" height="8" fill="#f5c518" opacity="0.5"/>
  <rect x="665" y="320" width="8" height="8" fill="#f5c518" opacity="0.4"/>

  <!-- オーバーレイ -->
  <rect width="800" height="600" fill="url(#overlay)"/>
</svg>
